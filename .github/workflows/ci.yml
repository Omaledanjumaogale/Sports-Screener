name: CI

# Full quality gate on every push/PR: typecheck, unit tests, svelte-check,
# production build. The PWA audit workflow runs separately after deploys.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Convex codegen (default + convex/ tsconfig)
        run: npx convex codegen

      - name: Convex typecheck
        run: npx tsc --noEmit -p convex/tsconfig.json

      - name: Unit tests
        run: npm test

      - name: svelte-check
        run: npm run check

      - name: Production build
        run: npm run build
